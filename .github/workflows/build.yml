name: Build data.json
on:
  push:
    paths: ['*.csv']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 convert.py
      - name: Commit data.json
        run: |
          git config user.name "spares-bot"
          git config user.email "spares-bot@users.noreply.github.com"
          git add data.json
          git commit -m "Update data.json from CSV" || echo "no change"
          git push
      - name: Rebuild site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST /repos/${{ github.repository }}/pages/builds || true
