name: Build data.json
on:
  push:
    paths: ['*.csv', '*.CSV', '*.xlsx', '*.XLSX', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python convert.py
      - name: Commit data files
        run: |
          git config user.name "spares-bot"
          git config user.email "spares-bot@users.noreply.github.com"
          git add data.json docs.json
          git commit -m "Update data from SAP export and documents" || echo "no change"
          git push
      - name: Rebuild site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST /repos/${{ github.repository }}/pages/builds || true
