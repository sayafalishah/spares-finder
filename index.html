<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14222B">
<title>Spares Finder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#E3E7E9;--card:#F8F9F9;--ink:#14222B;--mute:#566670;--line:#C5CDD2;--tag:#FFC20E;--tagink:#14222B;--bad:#B3261E;--ok:#1B6B47;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#10171B;--card:#1A2429;--ink:#E7ECEF;--mute:#8FA0AA;--line:#2C3A42;--bad:#FF8A80;--ok:#66D19E}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Bahnschrift","Roboto","Segoe UI","Helvetica Neue",Arial,sans-serif;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);min-height:100vh}
header{display:flex;align-items:center;gap:10px;padding:14px 14px 4px}
header h1{font-size:21px;margin:0;letter-spacing:.2px;flex:1}
#stat{font-size:13px;color:var(--mute);padding:0 14px 6px;display:flex;align-items:center;gap:7px}
#stat i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 12px 10px;z-index:5}
#q{width:100%;height:54px;font:inherit;font-size:19px;padding:0 16px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink)}
#q:focus-visible,.btn:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.btn{font:inherit;font-weight:600;font-size:15px;min-height:42px;padding:0 14px;border-radius:9px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.main{background:var(--tag);border-color:var(--tag);color:var(--tagink)}
.btn:disabled{opacity:.4}
#count{font-size:13px;color:var(--mute);padding:0 16px 4px}
ul{list-style:none;margin:0;padding:0 0 40px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 12px;padding:12px 14px}
.row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.code{background:var(--tag);color:var(--tagink);font-weight:800;font-size:17px;padding:3px 9px;border-radius:4px;font-variant-numeric:tabular-nums;word-break:break-all}
.qty{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.qty small{font-size:13px;font-weight:600;color:var(--mute);margin-left:4px}
.qty.zero{color:var(--bad)}
.desc{margin:9px 0 6px;font-size:17px}
.loc{margin:0;font-size:15px;color:var(--mute)}
.loc span{margin-right:16px;white-space:nowrap}
.loc b{color:var(--ink);font-size:17px}
mark{background:#FFC20E66;color:inherit;border-radius:2px}
details{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
summary{font-size:14px;color:var(--mute);cursor:pointer;min-height:30px}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:6px 0 0;font-size:14px}
dt{color:var(--mute)}dd{margin:0;word-break:break-word}
.empty{margin:24px 16px;padding:18px;border:2px dashed var(--line);border-radius:10px;color:var(--mute)}
.empty h2{margin:0 0 8px;color:var(--ink);font-size:18px}
.empty ol{padding-left:20px;margin:8px 0 0}
.empty li{margin:5px 0}
.more{display:block;margin:6px auto 0}
dialog{border:0;border-radius:14px;background:var(--card);color:var(--ink);width:min(92vw,520px);padding:18px}
dialog::backdrop{background:#000A}
dialog h2{margin:0 0 10px;font-size:19px}
dialog p{margin:6px 0;color:var(--mute);font-size:14px}
textarea{width:100%;min-height:80px;font:inherit;font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0}
select{width:100%;height:42px;font:inherit;margin-top:3px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:0 8px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;z-index:20;max-width:90vw}
#home{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.homewrap{width:min(100%,420px)}
.hometitle{font-size:32px;margin:0 0 4px;letter-spacing:.2px}
.homesub{margin:0 0 22px;color:var(--mute)}
.bigbtn{display:block;width:100%;text-align:left;border:0;border-radius:14px;background:var(--tag);color:var(--tagink);padding:22px 20px;font:inherit;cursor:pointer;position:relative}
.bigbtn span{display:block;font-size:24px;font-weight:800}
.bigbtn small{display:block;margin-top:6px;font-size:14px;font-weight:600;opacity:.8}
.bigbtn::after{content:"›";position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:34px;font-weight:700}
.bigbtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.logo{width:92px;height:92px;border-radius:18px;margin-bottom:16px;box-shadow:0 4px 14px #0003;background:#fff}
.item{box-shadow:0 1px 2px #0002,0 6px 18px #0000000d;animation:rise .25s ease}
.code{border:0;font-family:inherit;cursor:pointer;text-align:left}
.row2{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.bdg{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;letter-spacing:.3px}
.bdg.ok{background:#1B6B4724;color:var(--ok)}.bdg.bad{background:#B3261E24;color:var(--bad)}.bdg.blk{background:var(--line);color:var(--mute)}
.mut{font-size:13px;color:var(--mute)}
.locs{margin-top:6px;border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ls{font-size:14px;color:var(--mute)}.ls b{color:var(--ink)}
.bin{font:inherit;font-size:14px;font-weight:600;background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:6px;padding:3px 10px;min-height:34px;cursor:pointer}
.nb{font-size:14px;color:var(--mute)}
.lq{margin-left:auto;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}.lq.z{color:var(--bad)}
.mini{font:inherit;font-size:14px;font-weight:600;min-height:36px;padding:0 14px;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
dl+dl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.chips{display:flex;gap:8px;margin-top:9px}
.chips button{font:inherit;font-size:14px;font-weight:600;min-height:36px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#stale{margin:2px 12px 6px;padding:8px 12px;font-size:13px;border-left:4px solid var(--tag);background:#FFC20E26;border-radius:6px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#inv,#home{animation:rise .25s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 12px 40px}
.tile{font:inherit;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--tag);border-radius:12px;padding:12px 12px 10px;min-height:112px;display:flex;flex-direction:column;box-shadow:0 1px 2px #0002,0 6px 18px #0000000d;cursor:pointer;animation:rise .25s ease}
.tile b{font-size:15px;line-height:1.25}
.tile .tn{font-size:30px;font-weight:800;margin-top:auto;font-variant-numeric:tabular-nums}
.tile small{font-size:13px;color:var(--mute)}
.tile.dim{border-top-color:var(--mute);opacity:.85}
.tile:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
#crumb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 14px 6px}
#crumb b{font-size:18px}
#crumb .btn{min-height:36px;font-size:14px}
.docs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dchip{font:inherit;font-size:14px;font-weight:700;min-height:36px;padding:0 14px;border-radius:99px;border:2px solid var(--tag);background:#FFC20E22;color:var(--ink);cursor:pointer}
.chips{flex-wrap:wrap}
#docbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px 6px;font-size:13px;color:var(--mute)}
#docbar .btn{min-height:34px;font-size:13px;padding:0 12px}
#viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
#viewer[hidden]{display:none}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0)) 14px 10px;color:#fff}
.vbar .btn{color:#fff;border-color:#fff}
.vbody{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
.vbody img{max-width:100%;height:auto;display:block}
.alt{margin:-2px 0 8px;font-size:14px;color:var(--mute)}
.divider{margin:14px 14px 4px;font-size:14px;font-weight:700;color:var(--mute);border-top:2px solid var(--line);padding-top:10px}
.specs{margin-top:10px;padding:10px 12px;border-left:4px solid var(--tag);background:#FFC20E1f;border-radius:6px;font-size:15px}
.mini{margin-right:8px}
.mini.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>
</head>
<body>
<section id="home"><div class="homewrap"><img class="logo" src="icon-192.png" alt=""><h1 class="hometitle">Spares Finder</h1><p class="homesub">Choose an inventory</p><button class="bigbtn" id="openInv"><span>Instrument Inventory</span><small id="homeStat">No data yet. Connect to the internet once.</small></button></div></section>
<main id="inv" hidden>
<header>
  <button class="btn" id="back" aria-label="Back to home">‹ Home</button>
  <h1 id="title">Instrument Inventory</h1>
  <button class="btn" id="zoomBtn" aria-label="Text size">Aa</button>
  <button class="btn" id="expBtn" hidden>Export for publishing</button>
  <button class="btn main" id="updBtn" hidden>Update data</button>
</header>
<div id="stat"><i></i><span id="statTxt">Works offline · no data loaded yet</span></div>
<div id="stale" hidden></div>
<div id="docbar" hidden><span id="docInfo"></span><button class="btn" id="saveDocs">Save for offline</button></div>
<div class="bar"><input id="q" type="search" placeholder="Material code or description" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search material code or description">
  <div class="chips" id="chips"><button data-f="all" class="on">All</button><button data-f="in">In stock</button><button data-f="out">Out of stock</button><button data-f="docs">With documents</button></div></div>
<div id="crumb" hidden><b id="catName"></b><button class="btn" id="allCats">All lines</button></div>
<div id="count"></div>
<ul id="list"></ul>
</main>
<div id="viewer" hidden><div class="vbar"><b id="vcap"></b><button class="btn" id="vclose">Close</button></div><div class="vbody"><img id="vimg" alt=""></div></div>
<div id="toast" hidden></div>

<dialog id="imp">
  <h2>Update data</h2>
  <div id="s1">
    <p>Export the ZITEM_DIR list from SAP as a spreadsheet or tab-separated text file. If it is an Excel file, save it as CSV first.</p>
    <label>Choose the exported file<input id="file" type="file" accept=".csv,.tsv,.txt,text/csv,text/plain,text/tab-separated-values"></label>
    <label>Or paste the rows, including the header line<textarea id="paste"></textarea></label>
    <div class="acts"><button class="btn" id="c1">Cancel</button><button class="btn main" id="usePaste">Use pasted rows</button></div>
  </div>
  <div id="s2" hidden>
    <p id="pv"></p>
    <p>Tell the app which column is which.</p>
    <div id="maps"></div>
    <div class="acts"><button class="btn" id="c2">Back</button><button class="btn main" id="save">Save data</button></div>
  </div>
</dialog>

<script>
const $=s=>document.querySelector(s);
let DB=null,IDX=[],results=[],shown=60,PEND=null,tt;

/* ---------- storage (IndexedDB, with graceful fallback) ---------- */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('spares-finder',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function kvGet(k){try{const d=await idb();return await new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
async function kvSet(k,v){try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)});return true}catch(e){return false}}

/* ---------- helpers ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hl(s,t){const e=esc(s);if(!t.length)return e;const re=new RegExp('('+t.map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');return e.replace(re,'<mark>$1</mark>')}

/* ---------- parsing SAP exports ---------- */
function parseTable(text){
  text=text.replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/).find(l=>/\w/.test(l))||'';
  let d=',',best=1;
  for(const c of ['\t','|',';',',']){const n=first.split(c).length;if(n>best){best=n;d=c}}
  const useQ=d!=='|',rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(useQ&&c==='"'&&cell===''){q=true}
    else if(c===d){row.push(cell);cell=''}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
    else if(c!=='\r')cell+=c}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.map(r=>{r=r.map(x=>x.trim());if(d==='|'){if(r[0]==='')r.shift();if(r[r.length-1]==='')r.pop()}return r})
    .filter(r=>r.some(x=>x)&&!/^[-+=\s|]+$/.test(r.join('')));
}
const PAT={code:/material|mat\.?\s?(no|code)|item|part\s?(no|code)|^code$/i,desc:/descr|text|name/i,loc:/bin|locat|storage|rack|shelf/i,qty:/qty|quant|stock|unrestricted|avail/i,unit:/^unit|uom|\bbun\b|unit$/i,sloc:/storage|sloc/i};
function guess(h){const m={};const bi=h.findIndex(x=>/bin|rack|shelf/i.test(x));for(const k in PAT){if(k==='loc'&&bi>=0){m[k]=bi;continue}m[k]=h.findIndex((x,j)=>PAT[k].test(x)&&!(k==='code'&&/descr|text/i.test(x))&&!Object.values(m).includes(j))}return m}

/* ---------- search ---------- */
let FILTER='all',CAT=null,HASCAT=false,PI=-1,OUT=0,FIRSTOUT=0,DOCS={files:{}};
const LINES={'1000':'Line 1','1100':'Line 1','1200':'Line 2','1300':'Line 3'}; // plant -> line
const plabel=p=>/^\d+$/.test(p)?'Plant '+p:p;
const dk=c=>String(c).replace(/\s+/g,'').toUpperCase();
const docsFor=x=>DOCS.files[dk(x.code)]||[];
const qOf=x=>CAT!==null&&x.pl&&x.pl.get(CAT)?x.pl.get(CAT).qty:x.qty;
const pass=(x,q=qOf(x))=>FILTER==='in'?q>0:FILTER==='out'?!(q>0):FILTER==='docs'?docsFor(x).length>0:true;
const DL={photo:'Photo',drawing:'Drawing',datasheet:'Datasheet',manual:'Manual',other:'Document'};
const rank=k=>k==='Blocked / Inactive'?2:k==='Other'?1:0;
const num=v=>{const n=parseFloat(String(v||'').replace(/,/g,''));return isNaN(n)?0:n};
const qfmt=n=>n.toLocaleString(undefined,{maximumFractionDigits:3});
function setDB(d){
  DB=d;const m=d.map,g=new Map();PI=d.headers.findIndex(h=>/^plant$/i.test(h));
  d.rows.forEach((r,i)=>{const code=(r[m.code]||'').trim()||('row-'+i);let x=g.get(code);if(!x){x={code,rows:[],desc:''};g.set(code,x)}x.rows.push(i);if(!x.desc&&m.desc>=0)x.desc=r[m.desc]||''});
  const gi=d.headers.indexOf('External Group');
  IDX=[...g.values()].map(x=>{
    x.qty=x.rows.reduce((a,i)=>a+(m.qty>=0?num(d.rows[i][m.qty]):0),0);
    x.extra=m.extra>=0?[...new Set(x.rows.map(i=>d.rows[i][m.extra]).filter(Boolean))].join(' | '):'';
    x.spec=m.spec>=0?[...new Set(x.rows.map(i=>d.rows[i][m.spec]).filter(Boolean))].join(' | '):'';
    x.c=x.code.toLowerCase();x.h=(x.code+' '+x.desc+' '+x.extra+' '+x.spec).toLowerCase();
    x.b=x.rows.map(i=>(m.loc>=0?d.rows[i][m.loc]||'':'')+' '+(gi>=0?d.rows[i][gi]||'':'')).join(' ').toLowerCase();
    x.blk=/blocked/i.test(x.desc);x.s=0;x.pl=new Map();
    x.rows.forEach(i=>{const r=d.rows[i],p=PI>=0?(LINES[(r[PI]||'').trim()]||'Other'):'';let o=x.pl.get(p);if(!o){o={rows:[],qty:0};x.pl.set(p,o)}o.rows.push(i);o.qty+=m.qty>=0?num(r[m.qty]):0});
    return x});
  HASCAT=PI>=0;
  const when=new Date(d.ts).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
  $('#statTxt').textContent='Works offline · '+IDX.length.toLocaleString()+' materials · updated '+when;
  $('#homeStat').textContent=IDX.length.toLocaleString()+' materials · updated '+when;
  const st=$('#stale');st.hidden=Date.now()-d.ts<7*864e5;st.textContent='Stock shown as of '+when+'. Check SAP for current figures.';
}
function run(){
  const q=$('#q').value.trim().toLowerCase(),t=q.split(/\s+/).filter(Boolean);
  if(!DB){results=[];render(t);return}
  if(HASCAT&&CAT===null&&!t.length){renderCats();return}
  const r=[],outside=[];OUT=0;FIRSTOUT=0;
  const sc=x=>t.every(w=>x.h.includes(w))?(x.c===q?0:x.c.startsWith(q)?1:x.c.includes(q)?2:3):4;
  for(const x of IDX){
    if(CAT!==null&&!x.pl.has(CAT)){if(t.length&&pass(x,x.qty)&&t.every(w=>(x.h+' '+x.b).includes(w))){x.s=sc(x);outside.push(x)}continue}
    if(!pass(x))continue;
    if(t.length){
      const hb=x.h+' '+x.b;
      if(!t.every(w=>hb.includes(w)))continue;
      x.s=t.every(w=>x.h.includes(w))?(x.c===q?0:x.c.startsWith(q)?1:x.c.includes(q)?2:3):4;
    }
    r.push(CAT!==null?{...x,rows:x.pl.get(CAT).rows,qty:x.pl.get(CAT).qty}:x);
  }
  if(t.length)r.sort((a,b)=>a.s-b.s);
  outside.sort((a,b)=>a.s-b.s);
  FIRSTOUT=r.length;OUT=outside.length;
  results=r.concat(outside);shown=40;render(t);
}
const specOpen=(x,t)=>!!(x.spec&&t.length&&t.some(w=>x.spec.toLowerCase().includes(w)));
function specBox(x,t){return x.spec?'<div class="specs"'+(specOpen(x,t)?'':' hidden')+'>'+x.spec.split(' | ').map(s=>hl(s,t)).join('<br>')+'</div>':''}
function docChips(x){
  const L=docsFor(x);if(!L.length)return '';const cnt={},seen={};L.forEach(d=>cnt[d.t]=(cnt[d.t]||0)+1);
  return '<div class="docs">'+L.map((d,i)=>{seen[d.t]=(seen[d.t]||0)+1;return '<button class="dchip" data-dk="'+esc(dk(x.code))+'" data-di="'+i+'">'+(DL[d.t]||'Document')+(cnt[d.t]>1?' '+seen[d.t]:'')+'</button>'}).join('')+'</div>';
}
function openDoc(key,i){
  const L=DOCS.files[key]||[],d=L[i];if(!d)return;
  if(/\.(jpe?g|png|webp|gif)(\?|$)/i.test(d.f)){
    $('#vimg').src=d.f;$('#vcap').textContent=(DL[d.t]||'Document')+'  '+key;$('#viewer').hidden=false;history.pushState({v:1},'');
  }else window.open(d.f,'_blank');
}
function closeViewer(){if(!$('#viewer').hidden){$('#viewer').hidden=true;$('#vimg').removeAttribute('src')}}
$('#vclose').onclick=()=>history.back();
addEventListener('popstate',closeViewer);
function setDocs(d){
  DOCS=d&&d.files?d:{files:{}};const n=Object.values(DOCS.files).reduce((a,l)=>a+l.length,0);
  $('#docbar').hidden=!n;$('#docInfo').textContent=n.toLocaleString()+' documents available';
}
async function pruneDocs(){
  try{const keep=new Set(Object.values(DOCS.files).flat().map(d=>new URL(d.f,location.href).href));
    const c=await caches.open('spares-v3');
    for(const r of await c.keys()){if(new URL(r.url).pathname.includes('/docs/')&&!keep.has(r.url))await c.delete(r)}}catch(e){}
}
async function syncDocs(){
  try{const r=await fetch('docs.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const d=await r.json();
    if(d&&d.files&&d.v!==DOCS.v){setDocs(d);await kvSet('docs',d);run();pruneDocs()}}catch(e){}
}
async function saveAll(){
  const urls=Object.values(DOCS.files).flat().map(d=>d.f),b=$('#saveDocs');b.disabled=true;let n=0,bad=0;
  for(const u of urls){try{const r=await fetch(u);if(!r.ok)bad++;else await r.arrayBuffer()}catch(e){bad++}
    n++;if(n%5===0||n===urls.length)$('#docInfo').textContent='Saving '+n+' of '+urls.length}
  $('#docInfo').textContent=bad?'Saved. '+bad+' could not be saved':'All documents saved for offline use';b.disabled=false;
}
$('#saveDocs').onclick=saveAll;
function card(x,t){
  const m=DB.map,H=DB.headers,R=x.rows.map(i=>DB.rows[i]),unit=m.unit>=0?(R[0][m.unit]||''):'';
  const badge=x.blk?'<span class="bdg blk">Blocked</span>':x.qty>0?'<span class="bdg ok">In stock</span>':'<span class="bdg bad">Out of stock</span>';
  const locs=R.map(r=>{const q=m.qty>=0?num(r[m.qty]):0,bn=m.loc>=0?r[m.loc]||'':'';
    return '<div class="lrow">'+(PI>=0&&r[PI]?'<span class="ls">Plant <b>'+esc(r[PI])+'</b></span>':'')+(m.sloc>=0&&r[m.sloc]?'<span class="ls">Store <b>'+esc(r[m.sloc])+'</b></span>':'')
      +(bn?'<button class="bin" data-bin="'+esc(bn)+'">Bin '+esc(bn)+'</button>':'<span class="nb">No bin</span>')
      +'<span class="lq'+(q<=0?' z':'')+'">'+qfmt(q)+'</span></div>'}).join('');
  const all=R.map(r=>'<dl>'+r.map((v,k)=>v?'<dt>'+esc(H[k])+'</dt><dd>'+esc(v)+'</dd>':'').join('')+'</dl>').join('');
  return '<li class="item"><div class="row1"><button class="code" data-copy="'+esc(x.code)+'" title="Tap to copy">'+hl(x.code,t)+'</button><span class="qty'+(x.qty<=0?' zero':'')+'">'+qfmt(x.qty)+(unit?'<small>'+esc(unit)+'</small>':'')+'</span></div>'
    +'<div class="row2">'+badge+(R.length>1?'<span class="mut">Total of '+R.length+' locations</span>':'')+'</div>'
    +(x.desc?'<p class="desc">'+hl(x.desc,t)+'</p>':'')
    +(x.extra?'<p class="alt">Also known as: '+hl(x.extra,t)+'</p>':'')
    +'<div class="locs">'+locs+'</div>'+specBox(x,t)+docChips(x)+(x.spec?'<button class="mini'+(specOpen(x,t)?' on':'')+'" data-spec>Specs</button>':'')+'<button class="mini" data-share="'+esc(x.code)+'">Share</button>'
    +'<details><summary>All fields</summary>'+all+'</details></li>';
}
function chrome(){
  $('#crumb').hidden=CAT===null;$('#catName').textContent=CAT!==null?plabel(CAT):'';
  $('#back').textContent=CAT!==null?'‹ Back':'‹ Home';
  $('#q').placeholder=CAT!==null?'Search in '+plabel(CAT):'Material code or description';
}
function renderCats(){
  chrome();const c=new Map();
  for(const x of IDX){for(const [p,o] of x.pl){if(!pass(x,o.qty))continue;let e=c.get(p);if(!e){e={n:0,i:0};c.set(p,e)}e.n++;if(o.qty>0)e.i++}}
  const list=[...c].sort((a,b)=>String(a[0]).localeCompare(String(b[0]),undefined,{numeric:true}));
  $('#count').textContent='Choose a line, or search all materials above';
  $('#list').innerHTML=list.length?'<div class="tiles">'+list.map(([k,o])=>'<button class="tile'+(rank(k)===2?' dim':'')+'" data-cat="'+esc(k)+'"><b>'+esc(plabel(k))+'</b><span class="tn">'+o.n.toLocaleString()+'</span><small>'+o.i.toLocaleString()+' in stock</small></button>').join('')+'</div>':'<div class="empty"><h2>Nothing here</h2>No materials match this filter.</div>';
}
function render(t){
  chrome();
  const ul=$('#list'),cnt=$('#count');
  if(!DB){
    cnt.textContent='';
    ul.innerHTML='<div class="empty"><h2>No spares list yet</h2>Connect to the internet once and the list downloads automatically. After that it works offline.</div>';
    return;
  }
  const base=CAT!==null?IDX.reduce((a,x)=>a+(x.pl.has(CAT)?1:0),0):IDX.length;
  const outBtn='';
  cnt.textContent=CAT!==null&&t.length?FIRSTOUT.toLocaleString()+' in '+plabel(CAT)+', '+OUT.toLocaleString()+' in other lines':(t.length||FILTER!=='all')?results.length.toLocaleString()+' of '+base.toLocaleString()+' materials':base.toLocaleString()+' materials';
  if(!results.length){ul.innerHTML='<div class="empty"><h2>No match</h2>Try fewer words, part of the code, or a different filter.</div>'+outBtn;return}
  ul.innerHTML=results.slice(0,shown).map((x,i)=>(OUT>0&&i===FIRSTOUT?'<div class="divider">'+(FIRSTOUT?'More from other lines':'Nothing in '+plabel(CAT)+'. From other lines:')+'</div>':'')+card(x,t)).join('')+(results.length>shown?'<button class="btn more" id="more">Show more</button>':'')+outBtn;
  const mb=$('#more');if(mb)mb.onclick=()=>{shown+=40;render(t)};
}
async function copy(t,msg){
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
  toast(msg||'Copied '+t);
}
function shareItem(code){
  const x=IDX.find(y=>y.code===code);if(!x)return;const m=DB.map;
  const text=[x.code,x.desc,...x.rows.map(i=>{const r=DB.rows[i];return(m.sloc>=0&&r[m.sloc]?'Store '+r[m.sloc]+', ':'')+'Bin '+((m.loc>=0&&r[m.loc])||'-')+': '+qfmt(num(m.qty>=0?r[m.qty]:0))})].join('\n');
  if(navigator.share)navigator.share({text}).catch(()=>{});else copy(text,'Item details copied');
}
$('#list').addEventListener('click',e=>{
  const sp=e.target.closest('[data-spec]');if(sp){const p=sp.closest('.item').querySelector('.specs');p.hidden=!p.hidden;sp.classList.toggle('on',!p.hidden);return}
  const dc=e.target.closest('[data-di]');if(dc){openDoc(dc.dataset.dk,+dc.dataset.di);return}
  const ap=e.target.closest('[data-allplants]');if(ap){CAT=null;if(location.hash==='#cat')history.replaceState(null,'','#inv');run();window.scrollTo(0,0);return}
  const ct=e.target.closest('[data-cat]');if(ct){CAT=ct.dataset.cat;$('#q').value='';location.hash='cat';run();window.scrollTo(0,0);return}
  const c=e.target.closest('[data-copy]');if(c){copy(c.dataset.copy);return}
  const b=e.target.closest('[data-bin]');if(b){$('#q').value=b.dataset.bin;CAT=null;if(location.hash==='#cat')history.replaceState(null,'','#inv');run();window.scrollTo(0,0);return}
  const sh=e.target.closest('[data-share]');if(sh)shareItem(sh.dataset.share);
});
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;FILTER=b.dataset.f;[...$('#chips').children].forEach(c=>c.classList.toggle('on',c===b));run()};
$('#q').addEventListener('input',()=>{clearTimeout(run.t);run.t=setTimeout(run,100)});
let Z=1;try{Z=+localStorage.getItem('z')||1}catch(e){}
function zoom(){$('#list').style.zoom=Z}
$('#zoomBtn').onclick=()=>{Z=Z===1?1.15:Z===1.15?1.3:1;zoom();try{localStorage.setItem('z',Z)}catch(e){}toast(Z===1?'Normal text':Z===1.15?'Larger text':'Largest text')};
zoom();

/* ---------- update data ---------- */
function openImp(){$('#s1').hidden=false;$('#s2').hidden=true;$('#file').value='';$('#paste').value='';$('#imp').showModal()}
$('#updBtn').onclick=openImp;
$('#c1').onclick=()=>$('#imp').close();
$('#c2').onclick=()=>{$('#s1').hidden=false;$('#s2').hidden=true};
function openMap(rows,name){
  const h=rows[0].map((x,i)=>x||('Column '+(i+1)));
  PEND={headers:h,rows:rows.slice(1),name};
  const g=guess(h),lab={code:'Material code',desc:'Description',loc:'Bin or rack',sloc:'Storage location',qty:'Quantity',unit:'Unit'};
  $('#maps').innerHTML=Object.keys(lab).map(k=>'<label>'+lab[k]+'<select data-k="'+k+'"><option value="-1">None</option>'+h.map((x,i)=>'<option value="'+i+'"'+(g[k]===i?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label>').join('');
  $('#pv').textContent=PEND.rows.length.toLocaleString()+' rows found.';
  $('#s1').hidden=true;$('#s2').hidden=false;
}
async function readText(f){const b=await f.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){return new TextDecoder('windows-1252').decode(b)}}
$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  if(/\.xlsx?$/i.test(f.name)){toast('Save the Excel file as CSV, then choose it');return}
  const rows=parseTable(await readText(f));
  if(rows.length<2){toast('No rows found in that file');return}
  openMap(rows,f.name);
};
$('#usePaste').onclick=()=>{
  const rows=parseTable($('#paste').value);
  if(rows.length<2){toast('Paste the header line and at least one row');return}
  openMap(rows,'Pasted rows');
};
$('#save').onclick=async()=>{
  const map={};document.querySelectorAll('#maps select').forEach(s=>map[s.dataset.k]=+s.value);
  if(map.code<0){toast('Choose the Material code column');return}
  const d={headers:PEND.headers,rows:PEND.rows,map,ts:Date.now(),name:PEND.name};
  setDB(d);$('#q').value='';run();$('#imp').close();
  toast((await kvSet('data',d))?'Data saved on this phone':'Data loaded, but this browser could not save it');
};

/* ---------- automatic sync for every user ---------- */
let SIG=null;
async function sig(){try{const x=await fetch('data.json?v='+Date.now(),{method:'HEAD',cache:'no-store'});if(!x.ok)return null;return['etag','last-modified','content-length'].map(k=>x.headers.get(k)||'').join('|')}catch(e){return null}}
async function sync(){
  if(!navigator.onLine)return;
  syncDocs();
  try{
    const s=await sig();if(s&&s===SIG&&DB)return;
    const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const d=await r.json();
    if(!d||!d.map||!d.rows||!d.rows.length)return;
    SIG=s;
    if(!DB||d.ts!==DB.ts){setDB(d);await kvSet('data',d);run();toast('Spares list updated')}
  }catch(e){}
}
addEventListener('online',sync);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{
    if(e.data!=='app-updated')return;
    let last=0;try{last=+sessionStorage.getItem('reloaded')||0}catch(_){}
    if(Date.now()-last<60000)return;
    try{sessionStorage.setItem('reloaded',Date.now())}catch(_){}
    toast('App updated, refreshing…');setTimeout(()=>location.reload(),1200);
  });
}
setInterval(()=>{if(!document.hidden)sync()},300000);

/* ---------- home screen / navigation ---------- */
function view(){const h=location.hash,on=h==='#inv'||h==='#cat';$('#inv').hidden=!on;$('#home').hidden=on;if(h!=='#cat'&&CAT!==null){CAT=null;$('#q').value=''}if(on)run();window.scrollTo(0,0)}
$('#openInv').onclick=()=>{location.hash='inv'};
$('#allCats').onclick=()=>history.back();
$('#back').onclick=()=>{history.length>1?history.back():(location.hash='')};
addEventListener('hashchange',view);view();

/* ---------- start ---------- */
(async()=>{const dd=await kvGet('docs');if(dd)setDocs(dd);const st=await kvGet('data');if(st)setDB(st);run();sync()})();
</script>
</body>
</html>
